{% extends "base.html" %}

{% block title %}Iniciar sesión | Humahuaca{% endblock %}

{% block content %}
<section class="form-panel narrow-panel">

    <p class="eyebrow">Acceso a tu cuenta</p>
    <h1>Iniciar sesión</h1>

    <p>
        Ingresá para solicitar reservas o gestionar tu alojamiento.
    </p>

    <form method="post" class="stack-form">

        <input
            type="hidden"
            name="_csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="email">Correo electrónico</label>
        <input
            id="email"
            type="email"
            name="email"
            autocomplete="email"
            required
        >

        <label for="password">Contraseña</label>
        <input
            id="password"
            type="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Ingresar</button>

    </form>

    <p>
        ¿Todavía no tenés cuenta?
        <a href="{{ url_for('auth.registro') }}">Registrarse</a>
    </p>

</section>
{% endblock %}
